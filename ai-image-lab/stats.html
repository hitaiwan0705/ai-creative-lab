<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全班回饋｜即時統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=6">
<style>
  body{min-height:100vh}
  .st-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:14px clamp(16px,4vw,48px);border-bottom:1.5px solid var(--ink-text)}
  .st-top h1{margin:0;font-size:clamp(1.3rem,2.6vw,2rem);font-weight:900;color:var(--cobalt)}
  .st-top .spacer{flex:1}
  .seg-btn{display:inline-flex;border:2px solid var(--ink-text);border-radius:var(--r);overflow:hidden}
  .seg-btn a{padding:.35em .9em;text-decoration:none;font-weight:700;color:var(--ink-text)}
  .seg-btn a[aria-current="page"]{background:var(--cobalt);color:#fff}
  .st-top button{min-height:40px;border:2px solid var(--ink-text);border-radius:var(--r);background:var(--paper);font-weight:700;padding:0 .8em;color:var(--ink-text)}
  .st-wrap{padding:clamp(16px,3vw,40px) clamp(16px,4vw,48px)}
  .st-hero{display:flex;flex-wrap:wrap;gap:24px;align-items:baseline;margin-bottom:18px}
  .st-n{font-size:clamp(3rem,9vw,6.5rem);font-weight:900;line-height:1;color:var(--cobalt);font-variant-numeric:tabular-nums}
  .st-n small{font-size:.3em;color:var(--ink-soft);font-weight:700;margin-left:.3em}
  .st-meta{color:var(--ink-soft);font-family:var(--mono);font-size:.9rem}
  .st-demo{background:var(--terra-tint);color:var(--terra-text);font-weight:700;padding:.3em .8em;border-radius:var(--r)}
  .st-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
  .panel{border-top:4px solid var(--ink-text);padding-top:10px}
  .panel h2{margin:0 0 .2em;font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.35}
  .panel .sub{margin:0 0 10px;color:var(--ink-soft);font-size:.92rem}
  .hb{display:grid;gap:6px}
  .hb-row{display:grid;grid-template-columns:minmax(7em,1.3fr) 2fr 3.2em;gap:8px;align-items:center;font-size:clamp(.88rem,1.3vw,1.05rem)}
  .hb-row .lab{line-height:1.3}
  .hb-row .lab b{color:var(--cobalt);font-family:var(--mono);margin-right:.2em}
  .hb-track{height:22px;background:var(--paper-2);border-radius:0 4px 4px 0;position:relative}
  .hb-bar{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:#9AA0A8;transition:width .5s}
  .hb-row.ok .hb-bar{background:var(--cobalt)}
  .hb-row .val{font-family:var(--mono);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .cols5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:180px;margin-top:8px}
  .cols5 .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .cols5 .bar{width:100%;background:var(--cobalt);border-radius:4px 4px 0 0;transition:height .5s;min-height:2px}
  .cols5 .v{font-family:var(--mono);font-weight:700;margin-bottom:4px}
  .cols5 .x{font-size:.8rem;text-align:center;color:var(--ink-soft);margin-top:4px;line-height:1.2}
  .note{margin-top:10px;font-size:.92rem;color:var(--ink-soft)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-soft);margin-bottom:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:4px}
  .err{padding:16px;border:2px solid var(--terra-text);border-radius:var(--r);color:var(--terra-text);font-weight:700}
  @media (max-width:980px){.st-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="st-top">
  <h1>全班回饋｜即時統計</h1>
  <nav class="seg-btn" aria-label="選擇課堂"><a href="?s=1" data-s="1">第一堂</a><a href="?s=2" data-s="2">第二堂</a></nav>
  <span class="spacer"></span>
  <button type="button" id="since">從現在開始算</button>
  <button type="button" id="all">看全部</button>
  <button type="button" id="refresh">更新</button>
</header>
<main class="st-wrap">
  <div class="st-hero">
    <div class="st-n" id="n" aria-live="polite">–<small>人回覆</small></div>
    <div><div class="st-meta" id="meta">讀取中…</div><div class="st-meta" id="range"></div></div>
  </div>
  <div id="body"></div>
</main>
<script src="assets/stats-config.js?v=1"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var S = qs.get("s") === "2" ? 2 : 1;
  var DEMO = qs.get("demo") === "1";
  document.querySelectorAll(".seg-btn a").forEach(function (a) {
    if (+a.dataset.s === S) a.setAttribute("aria-current", "page");
    if (DEMO) a.href += "&demo=1";
  });

  // 題目簡稱與迷思標籤（只用於顯示；選項文字需與表單一致）
  var META = {
    1: {
      q1: { t: "Q1｜看得出 AI 改了什麼？", sub: "勾選比例。藍色＝真的有改；灰色＝沒改（勾了算誤報）" },
      q2: { t: "Q2｜為什麼 AI 會這樣修？", sub: "灰色選項各代表一種迷思",
            tag: { "因為這樣就是美的標準答案，AI 只是照著做": "迷思：美有標準答案",
                   "AI 從大量人類照片和修圖習慣中，學到某一種常見的審美，就往那個方向修": "✓ 從資料學來的審美",
                   "這是電腦程式的隨機錯誤": "迷思：隨機錯誤",
                   "因為每個使用者都主動要求這樣修": "迷思：都是使用者要的" } },
      q3: { t: "Q3｜「AI 修過的才是比較好的我」", sub: "越靠左＝越不同意" }
    },
    2: {
      q1: { t: "Q1｜找得到警訊嗎？", sub: "勾選比例。藍色＝真的警訊；灰色＝不是警訊（勾了算誤報）" },
      q2: { t: "Q2｜為什麼每個人的動態牆不一樣？", sub: "灰色選項各代表一種迷思",
            tag: { "因為手機型號不同": "迷思：硬體不同",
                   "系統根據每個人過去的按讚、停留時間等紀錄，推測並挑選內容": "✓ 推薦系統依行為推測",
                   "平台每天隨機分配": "迷思：隨機",
                   "有小編幫每個人人工挑選": "迷思：人工挑選" } },
      q3: { t: "Q3｜「很多人分享＝大概是真的」", sub: "越靠左＝越不同意" }
    }
  };

  var sinceKey = "statsSince" + S, since = null;
  try { since = localStorage.getItem(sinceKey); } catch (e) {}

  function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function hbars(obj, n, correct, tags) {
    return '<div class="hb">' + Object.keys(obj).map(function (k) {
      var ok = correct.indexOf(k) >= 0, p = pct(obj[k], n);
      var label = tags && tags[k] ? tags[k] : k;
      return '<div class="hb-row' + (ok ? " ok" : "") + '" title="' + esc(k) + "：" + obj[k] + ' 人">' +
        '<span class="lab">' + (ok && !(tags && tags[k]) ? "<b>✓</b>" : "") + esc(label) + "</span>" +
        '<span class="hb-track"><span class="hb-bar" style="width:' + p + '%"></span></span>' +
        '<span class="val">' + p + "%</span></div>";
    }).join("") + "</div>";
  }
  function cols(vals, labels) {
    var max = Math.max.apply(null, vals.concat([1]));
    return '<div class="cols5">' + vals.map(function (v, i) {
      return '<div class="c" title="' + esc(labels[i]) + "：" + v + ' 人"><span class="v">' + v + '</span><span class="bar" style="height:' + (v / max * 75) + '%"></span><span class="x">' + esc(labels[i]) + "</span></div>";
    }).join("") + "</div>";
  }

  function render(d) {
    var m = META[S];
    document.getElementById("n").innerHTML = d.n + "<small>人回覆</small>";
    document.getElementById("meta").innerHTML = (DEMO ? '<span class="st-demo">示範資料（不是真的回覆）</span> ' : "") +
      (d.updated ? "最新一筆：" + new Date(d.updated).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }) : "還沒有回覆");
    document.getElementById("range").textContent = since ? "只算 " + new Date(since).toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" }) + " 之後的回覆" : "全部回覆";
    if (!d.n) { document.getElementById("body").innerHTML = '<p class="lead">等第一位同學送出……</p>'; return; }
    var q3keys = Object.keys(d.q3);
    var avg1 = d.q1score.reduce(function (a, v, i) { return a + v * i; }, 0) / d.n;
    var okQ2 = d.q2correct.reduce(function (a, k) { return a + (d.q2[k] || 0); }, 0);
    var disagree = (d.q3[q3keys[0]] || 0) + (d.q3[q3keys[1]] || 0);
    document.getElementById("body").innerHTML =
      '<div class="legend"><span><i style="background:var(--cobalt)"></i>正確選項</span><span><i style="background:#9AA0A8"></i>錯誤選項／迷思</span></div>' +
      '<div class="st-grid">' +
        '<section class="panel"><h2>' + m.q1.t + '</h2><p class="sub">' + m.q1.sub + "</p>" + hbars(d.q1, d.n, d.q1correct) +
          '<p class="note">平均得分 <b>' + avg1.toFixed(1) + " / 4</b>（勾對減勾錯）</p>" +
          cols(d.q1score, ["0 分", "1 分", "2 分", "3 分", "4 分"]) + "</section>" +
        '<section class="panel"><h2>' + m.q2.t + '</h2><p class="sub">' + m.q2.sub + "</p>" + hbars(d.q2, d.n, d.q2correct, m.q2.tag) +
          '<p class="note">答對 <b>' + pct(okQ2, d.n) + "%</b></p></section>" +
        '<section class="panel"><h2>' + m.q3.t + '</h2><p class="sub">' + m.q3.sub + "</p>" +
          cols(q3keys.map(function (k) { return d.q3[k]; }), q3keys) +
          '<p class="note">不同意（1–2）<b>' + pct(disagree, d.n) + "%</b>。提醒：上完課大家知道「標準答案」，這一題容易偏向不同意。</p></section>" +
      "</div>";
  }

  function demo() {
    var W = S === 2 ?
      { q1: ["叫你趕快轉傳", "沒說是哪個單位公布的", "罰款數字很嚇人，卻沒有出處", "沒有附原始連結或公告", "用了驚嘆號，所以一定是假的", "是朋友傳的，所以可以相信", "字數太短"],
        q1c: ["叫你趕快轉傳", "沒說是哪個單位公布的", "罰款數字很嚇人，卻沒有出處", "沒有附原始連結或公告"],
        q2: Object.keys(META[2].q2.tag) } :
      { q1: ["眼睛變大", "臉變小、下巴變尖", "皮膚變光滑", "膚色變白、變亮", "髮型改變", "衣服改變", "背景改變"],
        q1c: ["眼睛變大", "臉變小、下巴變尖", "皮膚變光滑", "膚色變白、變亮"],
        q2: Object.keys(META[1].q2.tag) };
    var n = 32, q1 = {}, q2 = {}, q3 = {}, w1 = [.9, .7, .8, .6, .15, .05, .1];
    W.q1.forEach(function (o, i) { q1[o] = Math.round(n * w1[i]); });
    [3, 24, 2, 3].forEach(function (v, i) { q2[W.q2[i]] = v; });
    ["1 非常不同意", "2 不同意", "3 普通", "4 同意", "5 非常同意"].forEach(function (o, i) { q3[o] = [9, 12, 7, 3, 1][i]; });
    return { ok: true, n: n, updated: new Date().toISOString(), q1: q1, q1correct: W.q1c, q1score: [1, 3, 7, 12, 9], q2: q2, q2correct: [W.q2[1]], q3: q3 };
  }

  var cbN = 0;
  function load() {
    if (DEMO) { render(demo()); return; }
    if (!window.STATS_ENDPOINT) { showErr("尚未設定統計來源（assets/stats-config.js）。可在網址加上 ?demo=1 預覽。"); return; }
    var name = "__stats" + (++cbN), s = document.createElement("script"), done = false;
    window[name] = function (d) { done = true; delete window[name]; s.remove(); d && d.ok ? render(d) : showErr((d && d.error) || "讀取失敗"); };
    s.src = window.STATS_ENDPOINT + "?s=" + S + (since ? "&since=" + encodeURIComponent(since) : "") + "&callback=" + name + "&t=" + Date.now();
    s.onerror = function () { if (!done) showErr("連不到統計來源。請確認 Apps Script 已部署新版本、存取權為「所有人」。"); };
    document.body.appendChild(s);
  }
  function showErr(t) { document.getElementById("meta").textContent = ""; document.getElementById("body").innerHTML = '<p class="err">' + esc(t) + "</p>"; }

  document.getElementById("refresh").onclick = load;
  document.getElementById("since").onclick = function () { since = new Date().toISOString(); try { localStorage.setItem(sinceKey, since); } catch (e) {} load(); };
  document.getElementById("all").onclick = function () { since = null; try { localStorage.removeItem(sinceKey); } catch (e) {} load(); };
  load();
  setInterval(function () { if (!document.hidden) load(); }, 10000);
})();
</script>
</body>
</html>
