# 把 ai-image-lab/**/images/sources.txt 列出的生成圖下載並轉成 JPG，提交回 repo
#   直式（人像）裁成 900x1200；橫式裁成 1200x900
name: ai-image-lab fetch images
on:
  push:
    paths: ["ai-image-lab/**/images/sources.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        run: |
          pip install --quiet pillow
          for src in $(find ai-image-lab -path '*/images/sources.txt'); do
            dir=$(dirname "$src"); mkdir -p "/tmp/dl/$dir"
            grep -v '^#' "$src" | while read -r name url; do
              [ -z "$name" ] && continue
              [ -f "$dir/$name.jpg" ] && continue
              curl -fsSL -o "/tmp/dl/$dir/$name.png" "$url" && echo "got $dir/$name" || echo "FAILED $dir/$name"
            done
          done
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageOps
          for f in glob.glob('/tmp/dl/**/*.png', recursive=True):
              im = Image.open(f).convert('RGB')
              size = (900, 1200) if im.height >= im.width else (1200, 900)
              im = ImageOps.fit(im, size, Image.LANCZOS)
              out = f.replace('/tmp/dl/', '')[:-4] + '.jpg'
              im.save(out, quality=82, optimize=True, progressive=True)
              print('saved', out, os.path.getsize(out))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ai-image-lab
          git diff --cached --quiet && echo "nothing new" || (git commit -m "ai-image-lab: 加入生成圖片" && git push)
